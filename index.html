<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一起学 · AI 作业老师试用</title>
<meta name="description" content="体验八年级数学作业订正、错题复练、英语作文引导和单词短语听写。">
<meta name="robots" content="noindex, nofollow">
<style>
html body{margin:0;background:#eaf1fc;padding:25px;font-family:system-ui,sans-serif}
body > #study-tutor{max-width:1280px;margin:0 auto;box-shadow:0 12px 46px #3d619b24}

@media print{html body{background:#fff;padding:0}body > #study-tutor{box-shadow:none;background:#fff;overflow:visible}}

</head>
<body>
<noscript><p style="padding:16px">试用需要浏览器支持 JavaScript。如果当前页面无法操作，请用 Safari、Chrome 或 Edge 打开链接。</p></noscript>
<div id="study-tutor" lang="zh-CN">
  <div class="tutor-layout">
    <aside class="tutor-sidebar" aria-label="主导航">
      <button class="tutor-brand" data-nav="home" aria-label="一起学首页">
        <span class="tutor-logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>一起学<small>家庭学习助手</small></span>
      </button>
      <nav>
        <button data-nav="home" aria-current="page"><span aria-hidden="true">⌂</span> 我的学习</button>
        <button data-nav="math"><span aria-hidden="true">∑</span> 数学作业</button>
        <button data-nav="review"><span aria-hidden="true">↻</span> 同步学练</button>
        <button data-nav="book"><span aria-hidden="true">▤</span> 错题本</button>
        <button data-nav="english"><span aria-hidden="true">Aa</span> 英语辅导</button>
      </nav>
      <button class="tutor-parent" data-nav="parent"><span class="tutor-avatar" aria-hidden="true">家</span><span>家长周报<small>查看学习进展</small></span></button>
    </aside>
    <div class="tutor-workspace">
      <header class="tutor-top">
        <span class="tutor-context"><i></i>苏科版数学 · 八年级上册</span>
        <span class="tutor-demo">交互原型</span>
      </header>
      <main class="tutor-content" id="tutor-content"></main>
      <footer class="tutor-footer">使用示例作业和预设反馈演示。学习记录仅保存在当前浏览器。</footer>
    </div>
  </div>
</div>
<style>
  #study-tutor {
    --ink:#1c2944; --sub:#53637f; --line:#e0e8f5; --white:#fff;
    --brand:#235be4; --brand-hover:#1848c4; --brand-soft:#eaf1ff; --brand-ink:#1948ac;
    --warm:#a04b2a; --warm-soft:#fff1e9; --surface:#f7f9fd;
    --tutor-font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink); font:16px/1.55 var(--tutor-font);
    background:#f3f6fb; text-align:left; border-radius:25px; overflow:hidden; color-scheme:light;
  }
  #study-tutor[data-page="english"] {
    --brand:#6542d2; --brand-hover:#5635b8; --brand-soft:#f1ecff; --brand-ink:#5536b6;
  }
  #study-tutor *, #study-tutor *::before, #study-tutor *::after { box-sizing:border-box }
  #study-tutor [hidden] { display:none !important }
  #study-tutor :is(h1,h2,h3,p) { margin:0; color:inherit }
  #study-tutor h1 { font-size:clamp(28px,3.3vw,43px); font-weight:780; line-height:1.22; letter-spacing:-.045em }
  #study-tutor h2 { font-size:22px; font-weight:730; line-height:1.34; letter-spacing:-.035em }
  #study-tutor h3 { font-size:17px; font-weight:710; line-height:1.4 }
  #study-tutor :is(button,textarea,select,input) { font:inherit }
  #study-tutor button { cursor:pointer; text-align:inherit; color:inherit }
  #study-tutor :is(button,select,textarea,input,summary):focus-visible { outline:2px solid var(--brand); outline-offset:3px }
  #study-tutor .tutor-layout { display:grid; grid-template-columns:202px minmax(0,1fr); min-height:760px }
  #study-tutor .tutor-sidebar { background:#fff; border-right:1px solid #eaf0f8; padding:27px 16px 21px; display:flex; flex-direction:column; gap:31px }
  #study-tutor .tutor-brand, #study-tutor .tutor-parent { display:flex; align-items:center; gap:11px; background:none; border:0; padding:5px 8px; min-height:49px; font-weight:730 }
  #study-tutor .tutor-brand { font-size:22px; letter-spacing:-.05em; line-height:1.18 }
  #study-tutor small { display:block; color:var(--sub); font-size:13px; letter-spacing:0; font-weight:500 }
  #study-tutor .tutor-brand small, #study-tutor .tutor-parent small { margin-top:3px; font-size:12px; white-space:nowrap }
  #study-tutor .tutor-logo { position:relative; background:linear-gradient(150deg,#62bbff,#367dff 52%,#454ed8); width:43px; height:43px; border-radius:14px; display:grid; grid-template-columns:repeat(2,9px); grid-auto-rows:9px; gap:3px; place-content:center; flex:none; box-shadow:0 5px 12px #3776ed2e,inset 0 1px 1px #ffffff70 }
  #study-tutor .tutor-logo span { background:#f5fbff; border-radius:2px 3px 3px 2px }
  #study-tutor .tutor-logo span:nth-child(2) { background:#c4ccff; border-radius:4px 4px 2px 2px; transform:translateY(-2px) }
  #study-tutor nav { display:grid; gap:6px }
  #study-tutor nav button { border:0; background:transparent; border-radius:13px; padding:9px 10px; min-height:48px; display:flex; align-items:center; gap:10px; color:#50617e; white-space:nowrap; font-size:15px; font-weight:590 }
  #study-tutor nav button span { display:grid; place-items:center; width:29px; height:29px; flex:none; border-radius:9px; color:#65799b; font:680 16px/1 var(--tutor-font); background:#f1f5fb }
  #study-tutor nav button:hover, #study-tutor .tutor-parent:hover { background:#f2f6fc; border-radius:13px }
  #study-tutor nav button[aria-current], #study-tutor .tutor-parent[aria-current] { background:#eaf1ff; color:#1e53cd; font-weight:740; border-radius:13px }

  #study-tutor .tutor-workspace { min-width:0; display:flex; flex-direction:column; background:linear-gradient(180deg,#daedff 0,#edf5ff 166px,#f4f7fc 335px) }
  #study-tutor .tutor-top { min-height:60px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:16px 34px 5px }

  #study-tutor .tutor-footer { margin-top:auto; padding:19px 34px 21px; color:var(--sub); font-size:12px }

  #study-tutor .tutor-feature-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:17px }
  #study-tutor .tutor-feature { position:relative; isolation:isolate; overflow:hidden; border-radius:21px; padding:22px 21px; min-height:193px; display:flex; align-items:center; color:#fff; box-shadow:0 8px 20px #335bc523; border:1px solid #ffffff78 }
  #study-tutor .tutor-feature.math { background:radial-gradient(ellipse at 91% 110%,#61daffb5,transparent 60%),linear-gradient(119deg,#135fdb,#1c75ee 52%,#4bbaff) }
  #study-tutor .tutor-feature.english { background:radial-gradient(ellipse at 90% 104%,#d6a9ffa6,transparent 57%),linear-gradient(119deg,#5731c4,#7548e5 56%,#a17af9) }

  #study-tutor .tutor-feature .tutor-button { color:#2155ba; background:#fff; width:fit-content; margin-top:5px; box-shadow:0 3px 8px #14357925; padding:6px 14px; min-height:41px }
  #study-tutor .tutor-feature.english .tutor-button { color:#5834b4 }
  #study-tutor .tutor-feature .tutor-button:hover { background:#eff5ff }
  #study-tutor .tutor-art { width:184px; height:171px; position:absolute; right:10px; bottom:7px; pointer-events:none; z-index:0 }
  #study-tutor .tutor-art::before { content:""; position:absolute; right:8px; bottom:8px; width:155px; height:20px; border-radius:50%; background:#0f318c52; filter:blur(8px); transform:rotate(-6deg) }
  #study-tutor .art-page { position:absolute; left:38px; top:23px; width:101px; height:124px; transform:rotate(-16deg); background:linear-gradient(140deg,#f3fdff,#b3e8ff 64%,#82b7fd); border-radius:12px; border:1px solid #f6fdff; box-shadow:6px 7px 0 #7ac2ff83,0 8px 21px #1158bd74; overflow:hidden }
  #study-tutor .art-page::before { content:""; position:absolute; inset:27px 15px 14px; background:repeating-linear-gradient(to bottom,#579ee780 0 1px,transparent 1px 14px) }
  #study-tutor .art-page b { color:#3879d8; position:absolute; top:7px; left:14px; font-size:14px }
  #study-tutor .art-calc { position:absolute; right:11px; bottom:14px; width:76px; height:107px; padding:10px; display:grid; align-content:start; gap:8px; transform:rotate(13deg); background:linear-gradient(147deg,#a3f1ff,#3eaef6 41%,#3174eb 88%); border:1px solid #daffff9c; border-radius:15px; box-shadow:5px 6px 0 #1962cf9e,0 9px 18px #114ea87a,inset 2px 2px 4px #e8ffff84 }
  #study-tutor .art-calc b { color:#275cbc; border-radius:5px; background:#dcf7ffda; font:700 14px/26px Georgia,serif; text-align:center; box-shadow:inset 0 2px 3px #3674c53a }
  #study-tutor .art-keys { display:grid; grid-template-columns:repeat(3,1fr); gap:5px }
  #study-tutor .art-keys i { height:10px; border-radius:3px; background:linear-gradient(#e0f6ff,#7bd9ff); box-shadow:0 1px 1px #1956af88 }
  #study-tutor .art-keys i:last-child { background:linear-gradient(#fff1b5,#ffc184) }
  #study-tutor .art-spark { position:absolute; width:25px; height:25px; top:13px; right:5px; background:#eaffff; clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); filter:drop-shadow(0 0 5px #fff8); transform:rotate(12deg) }
  #study-tutor .art-spark.second { width:14px; height:14px; top:63px; left:7px; opacity:.88 }
  #study-tutor .art-word { position:absolute; left:33px; top:34px; width:109px; height:98px; display:grid; place-items:center; transform:rotate(-13deg); border-radius:22px; font:750 47px/1 Georgia,serif; letter-spacing:-.15em; text-indent:-.12em; color:#fef9ff; background:linear-gradient(142deg,#e2cdff,#a785ff 46%,#6948e5 85%); border:1px solid #f5eaffc9; text-shadow:0 3px 0 #5731b271; box-shadow:7px 7px 0 #5b3bc6b0,0 12px 21px #472aa26b,inset 2px 2px 4px #fff9 }
  #study-tutor .art-word::before { content:""; position:absolute; inset:8px; border-radius:15px; border:1px solid #ffffff37 }
  #study-tutor .art-bubble { position:absolute; right:9px; bottom:21px; width:77px; height:46px; display:grid; place-items:center; transform:rotate(11deg); border-radius:15px; background:linear-gradient(145deg,#fff0ff,#debeff 62%,#a779f0); border:1px solid #fdf4ffaf; color:#8856df; letter-spacing:.18em; font-weight:850; box-shadow:4px 4px 0 #945adac4,0 7px 14px #442d9e71 }
  #study-tutor .art-bubble::after { content:""; position:absolute; bottom:-6px; left:15px; width:12px; height:12px; background:#ccb0ff; transform:rotate(45deg); z-index:-1 }
  #study-tutor .tutor-kicker { color:var(--brand-ink); font-size:13px; font-weight:730 }
  #study-tutor .tutor-button { border:1px solid #d6e1f3; background:var(--white); border-radius:12px; padding:8px 15px; min-height:44px; display:inline-flex; justify-content:center; align-items:center; gap:7px; max-width:100%; font-size:14px; font-weight:700 }
  #study-tutor .tutor-button:hover { background:#f2f6ff; border-color:#c1d2f4 }
  #study-tutor .tutor-primary { background:var(--brand); border-color:transparent; color:#fff; box-shadow:0 3px 8px #3c66d323 }
  #study-tutor .tutor-primary:hover { background:var(--brand-hover); border-color:transparent }
  #study-tutor .tutor-section { margin-top:19px }
  #study-tutor .tutor-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:11px; flex-wrap:wrap }
  #study-tutor .tutor-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px }
  #study-tutor .tutor-panel { background:var(--white); border:1px solid var(--line); border-radius:18px; padding:19px; min-width:0; box-shadow:0 3px 12px #3d619b09 }
  #study-tutor .tutor-tools { background:linear-gradient(180deg,#f4faff 0,#fff 65px); padding:19px }

  #study-tutor .tutor-tools h2::after { position:absolute; z-index:-1; content:""; inset:auto 1px 2px; height:8px; border-radius:12px; background:#bddbffad; transform:rotate(-4deg) }
  #study-tutor .tutor-toolgrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:11px }
  #study-tutor .tutor-task { --task-fg:#1f75c5; --task-start:#b5edff; --task-end:#4babef; --task-halo:#dfedff; min-width:0; min-height:103px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px; background:#f2f6fc; border:1px solid #eef3fc; border-radius:14px; width:100%; transition:border-color .16s,background .16s }
  #study-tutor .tutor-task:hover { border-color:#b6cdf9; background:#edf4ff }
  #study-tutor .tutor-task.mint { --task-fg:#167d5b; --task-start:#b5f4c8; --task-end:#54c698; --task-halo:#e4f5e9 }
  #study-tutor .tutor-task.apricot { --task-fg:#9a531e; --task-start:#ffe3bd; --task-end:#f9a767; --task-halo:#fff0e4 }
  #study-tutor .tutor-task.lilac { --task-fg:#643eca; --task-start:#e7d2ff; --task-end:#a77bf2; --task-halo:#f0e7ff }

  #study-tutor .tutor-task small { font-size:12px }
  #study-tutor .tutor-task-icon { display:grid; place-items:center; width:33px; height:34px; border:1px solid #ffffff85; background:linear-gradient(150deg,var(--task-start),var(--task-end)); border-radius:10px; color:var(--task-fg); font:750 18px/1 var(--tutor-font); box-shadow:0 3px 5px #33619c25,inset 1px 1px 2px #ffffffb3,0 0 0 5px var(--task-halo); flex:none; margin:5px; transform:rotate(-6deg) }
  #study-tutor .tutor-muted { color:var(--sub) !important }
  #study-tutor .tutor-badge { display:inline-flex; width:fit-content; align-items:center; background:var(--brand-soft); color:var(--brand-ink); border-radius:20px; padding:5px 10px; font-size:13px; line-height:1.35; font-weight:700 }
  #study-tutor .tutor-badge.warm { background:var(--warm-soft); color:var(--warm) }
  #study-tutor .tutor-progress { display:flex; gap:13px; flex-wrap:wrap; align-items:center; justify-content:space-between }
  #study-tutor .tutor-schoolcard { background:linear-gradient(112deg,#effaff,#fff 54%); padding:15px 19px }
  #study-tutor .tutor-schoolinfo { display:flex; align-items:center; gap:12px }
  #study-tutor .tutor-schoolicon { background:#e1edff; color:#2459bf; border-radius:12px; width:39px; height:39px; display:grid; place-items:center; font-size:19px; font-weight:740; flex:none }

  #study-tutor .tutor-pagehead { display:grid; gap:7px; margin-bottom:20px }
  #study-tutor .tutor-row { display:flex; align-items:center; flex-wrap:wrap; gap:8px }

  #study-tutor .tutor-sheet { background:linear-gradient(165deg,#f8fbff,#fff 59%); border:1px solid #dbe6f7; border-radius:18px; padding:20px; display:grid; gap:13px; box-shadow:0 3px 12px #3d619b08 }

  function record(id) {
    return { ...emptyRecord, ...state.report[id] };
  }
  function updateRecord(id, patch) {
    state.report[id] = { ...record(id), ...patch };
    save();
  }
  function save() {
    try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch {}
  }
  function status(id) {
    const item = record(id);
    if (item.reviewed) return "复测通过";
    if (item.practiced) return item.assisted ? "提示后做对 · 待复测" : "独立做对 · 待复测";
    return item.corrected ? "待变式练习" : "待订正";
  }
  function badge(label, warm = false) {
    return `<span class="tutor-badge${warm ? " warm" : ""}">${label}</span>`;
  }
  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  }
  function button(label, props, variant = "") {
    return `<button type="button" class="tutor-button ${variant}" ${props}>${label}</button>`;
  }
  function pageHead(kicker, title, copy) {
    return `<div class="tutor-pagehead"><p class="tutor-kicker">${kicker}</p><h1 id="tutor-title">${title}</h1><p class="tutor-muted">${copy}</p></div>`;
  }
  function feedback(copy, warning = false) {
    return `<div class="tutor-feedback${warning ? " warm" : ""}" role="${warning ? "alert" : "status"}">${copy}</div>`;
  }
  function focus(selector) {
    const target = main.querySelector(selector);
    if (target) target.focus({ preventScroll:true });
  }
  function go(next, id = "", mode = "") {
    stopDictationPlayback();
    page = next;
    active = id;
    taskMode = mode;
    message = null;
    practiceHelp = false;
    render();
    focus("#tutor-title, h1");
    root.scrollIntoView({ block:"nearest", behavior:"instant" });
  }

    </button>`;
  }

  function dictationResults(round) {
    const right = round.responses.filter(item => item.correct).length;

    return `<section class="tutor-panel tutor-stack">
      <div class="tutor-heading"><h2>听写完成</h2>${badge(`答对 ${right} / ${round.items.length}`)}</div>

        ${wrong ? button(`重练 ${wrong} 个错项`,'data-dictation="retry"','tutor-primary') : ""}

  function tidySpelling(text) {
    return text.normalize("NFKC").trim()
      .replace(/[‘’]/g,"'").replace(/[‐‑–]/g,"-").replace(/\s+/g," ")
      .replace(/[.,!?。！？]+$/u,"").trim();
  }

  function startDictation(items) {
    stopDictationPlayback();
    dictationRound = {items:items.slice(), index:0, responses:[]};
    render();
    focus('[data-dictation="play"]');
  }

  function checkDictation(answer, skipped = false) {
    const round = dictationRound;
    if (!round || round.index >= round.items.length || round.responses[round.index]) return;
    const cleaned = tidySpelling(answer).toLowerCase();
    if (!skipped && !cleaned) {
      main.querySelector("[data-dictation-validation]").textContent = "先输入听到的英文，或点「这项不会」。";
      return;
    }
    const expected = round.items[round.index];
    round.responses.push({ expected, answer:answer.trim(), correct:!skipped && cleaned === tidySpelling(expected).toLowerCase() });
    stopDictationPlayback();
    render();
    focus('[data-dictation="next"]');
  }

  function saveDictationList(text, form) {
    const entries = text.split(/\r?\n/u).map(tidySpelling).filter(Boolean);
    const validation = form.querySelector("[data-dictation-validation]");
    if (!entries.length || entries.length > 30) {
      validation.textContent = "请填写 1 到 30 项，每行一项。";
      return;
    }
    const expression = dictationMode === "words"
      ? /^[a-z]+(?:['-][a-z]+)*$/i : /^[a-z]+(?:['-][a-z]+)*(?: [a-z]+(?:['-][a-z]+)*)+$/i;
    const invalid = entries.findIndex(entry => entry.length > 80 || !expression.test(entry));
    if (invalid !== -1) {
      validation.textContent = `第 ${invalid + 1} 项不符合格式。请每行只写一个英文${dictationNames[dictationMode]}。`;
      return;
    }
    state.dictationLists[dictationMode] = entries.join("\n");
    save();
    startDictation(entries);
  }

  function dictationStatus(text) {
    const statusElement = main.querySelector("[data-dictation-status]");
    if (statusElement) statusElement.textContent = text;
  }

  function stopDictationPlayback() {
    const current = dictationPlayback;
    dictationPlayback = null;
    if (current?.audio) current.audio.pause();
    if (current?.speech) window.speechSynthesis.cancel();
  }

  function playDictation(slow) {
    const round = dictationRound;
    const item = round?.items[round.index];
    if (!item) return;
    stopDictationPlayback();
    const current = {};
    dictationPlayback = current;
    const status = text => { if (dictationPlayback === current) dictationStatus(text); };
    const finished = () => {
      status("播放结束，可重听。");
      if (dictationPlayback === current) dictationPlayback = null;
    };
    const key = item.toLowerCase();
    const clip = Object.prototype.hasOwnProperty.call(dictationSampleAudio,key) && dictationSampleAudio[key];
    if (clip) {
      const audio = new Audio("data:audio/mp4;base64," + clip);
      current.audio = audio;
      audio.playbackRate = slow ? .76 : 1;
      audio.addEventListener("playing",() => status(slow ? "正在慢速播放…" : "正在播放…"),{once:true});
      audio.addEventListener("ended",finished,{once:true});
      audio.play().catch(() => status("播放没成功，请检查声音或换到系统浏览器重试。"));
      return;
    }
    const synth = window.speechSynthesis;
    if (!synth || !window.SpeechSynthesisUtterance) {
      status("当前浏览器无法朗读自定义词表。可以改用示例听写，或换系统浏览器。");
      return;
    }
    const englishVoices = synth.getVoices().filter(voice => /^en(?:[-_]|$)/i.test(voice.lang));
    const preferred = englishVoices.find(voice => voice.localService && voice.lang.toLowerCase() === "en-us")
      || englishVoices.find(voice => voice.localService) || englishVoices[0];
    const speech = new SpeechSynthesisUtterance(item);
    speech.lang = preferred?.lang || "en-US";
    if (preferred) speech.voice = preferred;
    speech.rate = slow ? .7 : .88;
    current.speech = speech;
    speech.onstart = () => status(slow ? "正在慢速播放…" : "正在播放…");
    speech.onend = finished;
    speech.onerror = () => status("设备英文语音未能播放。请试用示例音频，或检查系统英文语音。");
    try {
      status("正在准备英文语音…");
      synth.speak(speech);
    } catch {
      status("设备英文语音未能播放。请试用示例音频，或检查系统英文语音。");
    }
  }

  function handleDictation(action) {
    const [type,value] = action.split("-");
    switch (type) {
      case "mode":
        dictationMode = value;
        render();
        focus(`[data-dictation="mode-${value}"]`);
        break;
      case "samples":
        startDictation(dictationSamples[dictationMode]);
        break;
      case "play":
      case "slow":
        playDictation(type === "slow");
        break;
      case "skip":
        checkDictation("",true);
        break;
      case "next": {
        stopDictationPlayback();
        const round = dictationRound;
        round.index++;
        if (round.index === round.items.length) {
          state.lastDictation = {mode:dictationMode, right:round.responses.filter(item => item.correct).length, total:round.items.length};
          save();
        }
        render();
        focus(round.index === round.items.length ? "#tutor-title" : '[data-dictation="play"]');
        break;
      }
      case "retry":
        startDictation(dictationRound.responses.filter(item => !item.correct).map(item => item.expected));
        break;
      case "reset":
        stopDictationPlayback();
        dictationRound = null;
        render();
        focus('[data-dictation="samples"]');
        break;
    }
  }

    </div>`;
  }
  function writingTip(key) {
    return {
      place:"读一读第一句。读者能找到清楚的时间和地点吗？",
      activity:"试着补一个能让别人想象现场的动作，检查动词是否用了过去式。",
      feeling:"除了写感受，再用 because 说明是哪件事让你这么想。"
    }[key] || "选一个要点，看看可以怎么检查。";
  }
  function review() {
    const queued = Object.keys(state.report).filter(id => record(id).practiced && !record(id).reviewed);
    const next = state.chapter + 1;
    return `${pageHead("同步学练","跟上学校，也回头看看","选好学校进度，每次复习或预习一个小知识点。")}
      <section class="tutor-panel tutor-stack">
        <label><strong>学校现在讲到</strong>
          <select data-school>${chapters.map((chapter,i) => `<option value="${i}"${i === state.chapter ? " selected" : ""}>第 ${i+1} 章 · ${chapter}</option>`).join("")}</select>
        </label>
        <div class="tutor-row">${[["due","错题复测"],["current","本章复习"],["next","下章预习"]].map(([k,label]) => button(label,`data-review="${k}" aria-pressed="${reviewTab === k}"`,reviewTab === k ? "tutor-primary" : "")).join("")}</div>
      </section>
      <section class="tutor-section tutor-panel tutor-stack">
        ${reviewTab === "due" ?
          active ? quizBody(active,"review") : `<h2>间隔复测</h2>
          ${queued.length ? `<p class="tutor-muted">实际使用时隔几天再做。这里可以直接体验复测。</p>
            ${queued.map(id => `<button class="tutor-checkrow" data-action="review-${id}"><span><strong>${records[id].point}</strong><small>${record(id).due ? "建议复测 " + new Date(record(id).due).toLocaleDateString("zh-CN") : "已加入复测"}</small></span>${badge("体验复测")}</button>`).join("")}`
            : `<p class="tutor-muted">还没有待复测的题。作业订正后做对一道新题，就会加入这里。</p>${button("打开数学作业",'data-nav="math"')}`}`
          : reviewTab === "current" ? `<h2>${chapters[state.chapter]} · 复习</h2><p>${lessons[state.chapter][0]}</p>
            ${state.chapter === 4 ? button("看一道本章作业题",'data-action="open-slope"') : state.chapter === 0 ? button("试一道三角形证明题",'data-action="open-proof"') : ""}`
          : next < chapters.length ? `<h2>${chapters[next]} · 预习</h2><p>${lessons[next][1]}</p>` :
            `<h2>本册已到最后一章</h2><p class="tutor-muted">可以回顾本章知识点，或复测以前的错题。</p>`}
      </section>`;
  }
  function book() {
    const ids = Object.keys(state.report);
    return `${pageHead("我的错题本","把错过的，再练会","按知识点回看，或者带到纸上练。")}
      ${ids.length ? `<section class="tutor-panel tutor-stack">
        ${ids.map(id => {
          const item = records[id];
          return `<div class="tutor-checkrow tutor-book">
            <span><small>${item.subject} · ${item.title}</small><strong>${item.point}</strong><small>${status(id)}</small></span>
            ${button(active === id ? "收起" : "查看",`data-action="book-${id}" aria-expanded="${active === id}"`)}
            ${active === id ? `<div class="tutor-sheet" style="grid-column:1/-1"><p><strong>原题</strong>　${item.original}</p><p><strong>原作答</strong>　${item.attempt}</p><p><strong>错因</strong>　${item.cause}</p>
              ${button(record(id).corrected ? "再练一道" : "去订正",`data-action="${record(id).corrected ? "practice" : "open"}-${id}"`)}
            </div>` : ""}
          </div>`;
        }).join("")}
        <label>练习卷内容<select data-export><option value="practice">薄弱点变式练</option><option value="original">原错题重做</option></select></label>
        <div class="tutor-row">${swap("下载练习卷","download")}${button("打印 / 存为 PDF",'data-action="print"')}</div>
        <small>下载的是可离线打开的 HTML 练习卷，答案安排在独立区域。</small>
        ${message ? feedback(message.text,message.warning) : ""}
      </section>` : `<section class="tutor-panel tutor-stack"><h2>还没有错题</h2><p class="tutor-muted">批改示例作业，错题就会自动出现在这里。</p>${button("去检查作业",'data-nav="math"','tutor-primary')}</section>`}`;
  }
  function parent() {
    const ids = Object.keys(state.report);
    const done = ids.filter(id => record(id).corrected).length;
    const reviewCount = ids.filter(id => record(id).reviewed).length;
    return `${pageHead("家长周报","看看孩子学到哪儿了","以下统计来自这次原型里的学习记录。")}
      <div class="tutor-grid">
        <section class="tutor-panel"><small>本次独立或引导订正</small><h2>${done} 道</h2></section>
        <section class="tutor-panel"><small>复测通过</small><h2>${reviewCount} 个知识点</h2></section>
      </div>
      <section class="tutor-section tutor-panel tutor-stack"><h2>接下来练什么</h2>
        ${ids.length ? ids.map(id => `<div class="tutor-progress"><strong>${records[id].point}</strong>${badge(status(id), !record(id).corrected)}</div>`).join("") : '<p class="tutor-muted">还没有学习记录。完成一次批改后再来看。</p>'}
        ${state.writingFinished ? '<p>英语作文已经完成一次自查修改。</p>' : ""}
        ${state.lastDictation ? `<p>最近一次${dictationNames[state.lastDictation.mode]}听写答对 ${state.lastDictation.right} / ${state.lastDictation.total} 项。</p>` : ""}
      </section>`;
  }
  function render() {
    const views = { home, math, english, review, book, parent };
    root.dataset.page = page;
    main.innerHTML = views[page]();
    const heading = main.querySelector("h1");
    heading?.setAttribute("tabindex", "-1");
    root.querySelectorAll("[data-nav]").forEach(el => {
      if (!el.closest(".tutor-sidebar") || el.classList.contains("tutor-brand")) return;
      if (el.dataset.nav === page) el.setAttribute("aria-current","page");
      else el.removeAttribute("aria-current");
    });
    const triangle = main.querySelector("[data-triangle]");
    if (triangle) drawTriangle(triangle);
  }
  function line(ctx,x1,y1,x2,y2) {
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }
  function drawTriangle(canvas) {
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const A=[169,21], B=[55,120], C=[283,120], D=[169,120];
    ctx.fillStyle = "#e3efff";
    ctx.beginPath();
    ctx.moveTo(...A); ctx.lineTo(...B); ctx.lineTo(...C); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle="#4266af";ctx.lineWidth=2;
    line(ctx,...A,...B);line(ctx,...B,...C);line(ctx,...C,...A);
    ctx.strokeStyle="#8b5fce";
    line(ctx,...A,...D);
    ctx.fillStyle="#213051";
    ctx.font="italic 16px Georgia";
    for (const [label,x,y] of [["A",163,16],["B",40,134],["C",290,134],["D",163,140]]) ctx.fillText(label,x,y);
  }
  function exportItems() {
    const selected = main.querySelector("[data-export]")?.value || "practice";
    const ids = Object.keys(state.report);
    const needs = ids.filter(id => !record(id).reviewed);
    return (selected === "practice" && needs.length ? needs : ids).map(id => {
      const item = records[id];
      return { topic:item.point, q:selected === "practice" ? item.practice.q : item.original,
        answer:selected === "practice" ? item.practice.choices[item.practice.a] + "。 " + item.practice.hint : item.solution,
        choices:selected === "practice" ? item.practice.choices : [] };
    });
  }
  function exportContent() {
    const items = exportItems();
    return `<h1>一起学 · 错题练习卷</h1><p>姓名 ______________　日期 ______________</p>
     <ol>${items.map(item => `<li style="margin-bottom:26px"><p>${esc(item.q)}</p>
      ${item.choices.length ? `<p>${item.choices.map((c,i) => `${String.fromCharCode(65+i)}. ${esc(c)}`).join("　")}</p>` : ""}
      <p style="color:#53637f;min-height:45px">答：________________________________________________</p></li>`).join("")}</ol>
     <section class="tutor-answer-sheet" style="break-before:page"><h2>参考答案与知识点</h2><ol>${items.map(item => `<li><p><strong>${esc(item.topic)}</strong></p><p>${esc(item.answer)}</p></li>`).join("")}</ol></section>`;
  }
  function exportSheet(print) {
    const body = exportContent();
    if (print) {
      const area = root.querySelector(".tutor-print") || root.appendChild(document.createElement("article"));
      area.className = "tutor-print";
      area.innerHTML = body;
      window.print();
      return;
    }
    const html = `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起学 · 错题练习卷</title><style>body{font:16px/1.7 'PingFang SC',sans-serif;color:#1c2944;margin:32px auto;padding:0 20px;max-width:800px}li{break-inside:avoid}section{margin-top:34px;border-top:1px solid #e0e8f5}@media print{section{border:0;margin:0}}</style><body>${body}`;
    const url = URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));
    const a = document.createElement("a");
    a.href = url; a.download = "一起学-错题练习卷.html";
    root.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  root.addEventListener("click", e => {
    const el = e.target.closest("button");
    if (!el || !root.contains(el)) return;
    if (el.dataset.nav) {
      if (el.dataset.nav === "english") englishTab = "grammar";
      go(el.dataset.nav);
      return;
    }
    if (el.dataset.review) {
      reviewTab = el.dataset.review;
      go("review");
      return;
    }
    if (el.dataset.dictation) { handleDictation(el.dataset.dictation); return; }
    const action = el.dataset.action;
    if (!action) return;
    if (action === "school") { reviewTab = "current"; go("review"); focus("[data-school]"); return; }
    if (action === "check-math") {
      state.checked = true;
      ["slope","proof"].forEach(id => { if (!state.report[id]) updateRecord(id,{}); });
      go("math");
      focus('[data-action="open-slope"]');
      return;
    }
    if (action === "check-english") { updateRecord("english",{}); go("english"); return; }
    if (["english-essay","english-grammar","english-dictation"].includes(action)) {
      englishTab = action.slice("english-".length);
      go("english"); return;
    }
    if (action === "essay-back") { state.essayStep--; save(); go("english"); return; }
    if (action === "hint-proof") {
      state.hint++;
      save();
      message = null;
      render();
      focus("[data-answer] input");
      return;
    }
    if (action === "download" || action === "print") { exportSheet(action === "print"); return; }
    const [kind,id] = action.split("-");
    if (!records[id]) return;
    if (kind === "book") { go("book",active === id ? "" : id); return; }
    if (kind === "review") { reviewTab = "due"; go("review",id,"review"); return; }
    if (kind === "practice" || kind === "open") {
      if (!state.report[id]) updateRecord(id,{});
      if (id === "english") englishTab = "grammar";
      go(id === "english" ? "english" : "math",id,kind === "practice" ? "practice" : "check");
    }
  });
  root.addEventListener("change", e => {
    if (e.target.matches("[data-photo]")) {
      const file = e.target.files[0];
      if (photoPreview) URL.revokeObjectURL(photoPreview);
      photoPreview = file ? URL.createObjectURL(file) : "";
      const image = main.querySelector(".tutor-preview");
      image.hidden = !photoPreview;
      if (photoPreview) image.src = photoPreview;
      else image.removeAttribute("src");
    }
    if (e.target.matches("[data-school]")) {
      state.chapter = Number(e.target.value);
      save();
      render();
      focus("[data-school]");
    }
    if (e.target.matches('[data-writing] [name="focus"]')) {
      main.querySelector("[data-writing-tip]").textContent = writingTip(e.target.value);
    }
  });
  root.addEventListener("submit", e => {
    const form = e.target;
    if (!form.matches("[data-answer],[data-writing],[data-dictation-form]")) return;
    e.preventDefault();
    const data = new FormData(form);
    if (form.dataset.dictationForm) {
      if (form.dataset.dictationForm === "custom") saveDictationList(String(data.get("list")),form);
      else checkDictation(String(data.get("dictationAnswer")));
      return;
    }
    if (form.dataset.writing) {
      const kind = form.dataset.writing;
      const field = kind === "ideas" ? "ideas" : "draft";
      const value = String(data.get(field) || "").trim();
      if (!value) { form.elements[field].value = ""; form.reportValidity(); return; }
      message = null;
      if (kind === "ideas") { state.essayIdeas = value; state.essayStep = 1; }
      if (kind === "draft") {
        if (state.essayDraft !== value) {
          state.essayRevision = "";
          state.writingFinished = false;
        }
        state.essayDraft = value; state.essayStep = 2;
      }
      if (kind === "revision") {
        state.essayRevision = value; state.essayFocus = String(data.get("focus")); state.writingFinished = true;
        message = {text:"你的修改稿已保存。可以对照提纲再读一遍。"};
      }
      save();
      render();
      focus("#tutor-title");
      return;
    }
    const id = form.dataset.answer, mode = form.dataset.mode;
    const choice = Number(data.get("choice"));
    if (id === "proof-step") {
      const s = proofStages[state.proof];
      if (choice === s.a) {
        state.proof++;
        state.hint = 0;
        if (state.proof === proofStages.length) updateRecord("proof",{corrected:true});
        else save();
        message = {text:"这一步成立，再试试下一步。"};
      } else {
        message = {warning:true,text:"再看一眼前面已经写对的条件。也可以点「给我一点提示」。"};
      }
    } else {
      const item = records[id][mode];
      if (choice !== item.a) {
        practiceHelp = true;
        message = {warning:true,text:"再试一试。" + item.hint};
      } else if (mode === "check") {
        updateRecord(id,{corrected:true});
        message = {done:true,text:"订正成功。来一道新题看看能不能自己做。"};
      } else if (mode === "practice") {
        const due = new Date();
        due.setDate(due.getDate() + (practiceHelp ? 2 : 3));
        updateRecord(id,{practiced:true, assisted:practiceHelp, due:due.toISOString()});
        message = {done:true,text:(practiceHelp ? "提示后做对。" : "这道新题独立做对了。") + "已经加入间隔复测。"};
      } else {
        const due = new Date();
        due.setDate(due.getDate() + 2);
        updateRecord(id,practiceHelp ? {reviewed:false, assisted:true, due:due.toISOString()} : {reviewed:true,due:null});
        message = {done:true,text:practiceHelp ? "提示后答对，已安排下一次复测。" : "复测通过。可以在错题本查看进度。"};
      }
    }
    render();
    focus("[data-answer] input, .tutor-content [data-action^='practice-'], .tutor-content [data-nav='book']");
  });
  render();
})();
</script>

</body>
</html>
